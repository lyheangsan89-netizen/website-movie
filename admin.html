<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - StreamVault</title>
    <link rel="icon" href="logo (2).png">

    <link rel="stylesheet" href="tailwind.css">

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="polyfills.js"></script>
    <script src="build/auth.js"></script>

    <script>
        if (!window.SV_AUTH || !SV_AUTH.isAdmin()) {
            window.location.replace("login.html");
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
    </style>
</head>

<body class="bg-dark-900 text-white font-sans min-h-screen">
    <div id="root"></div>
    <script src="build/admin.js"></script>
</body>

</html>
