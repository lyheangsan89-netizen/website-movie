<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - StreamVault</title>
    <link rel="icon" href="logo (2).png">

    <link rel="stylesheet" href="tailwind.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-dark-900 text-white font-sans min-h-screen flex items-center justify-center p-4"
    style="background-image: radial-gradient(ellipse at top, rgba(229,9,20,0.12), transparent 55%), radial-gradient(ellipse at bottom right, rgba(139,92,246,0.1), transparent 55%);">

    <div class="w-full max-w-md animate-fade-in">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <img src="logo (2).png" alt="StreamVault" class="h-16 mx-auto mb-3 rounded-xl object-contain"
                    onerror="this.style.display='none'">
            </a>
            <h1 class="text-3xl font-extrabold tracking-tight">Stream<span class="text-accent-red">Vault</span></h1>
            <p class="text-gray-500 mt-1 text-sm">Admin Panel</p>
        </div>

        <div id="login-card" class="bg-dark-800 border border-dark-600 rounded-2xl p-8 shadow-2xl animate-slide-up">
            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" id="username" autocomplete="username" placeholder="Enter your username"
                        class="w-full bg-dark-700 border border-dark-500 rounded-xl px-4 py-3 text-sm outline-none focus:border-accent-red focus:ring-2 focus:ring-accent-red/20 transition placeholder-gray-600"
                        required>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password"
                            class="w-full bg-dark-700 border border-dark-500 rounded-xl px-4 py-3 pr-11 text-sm outline-none focus:border-accent-red focus:ring-2 focus:ring-accent-red/20 transition placeholder-gray-600"
                            required>
                        <button type="button" id="toggle-pass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path id="eye-icon" stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="error-msg"
                    class="hidden bg-accent-red/10 border border-accent-red/30 text-accent-red text-sm rounded-xl px-4 py-3 flex items-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
                    </svg>
                    <span id="error-text">Invalid username or password</span>
                </div>

                <button type="submit"
                    class="w-full bg-accent-red hover:bg-red-700 active:scale-[0.98] transition rounded-xl py-3 font-semibold text-sm shadow-lg shadow-accent-red/20">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">
            <a href="index.html" class="hover:text-gray-400 transition">← Back to StreamVault</a>
        </p>
    </div>

    <!-- Shared auth service (same one used by the app and admin dashboard) -->
    <script src="polyfills.js"></script>
    <script src="build/auth.js"></script>
    <script src="build/login.js"></script>
</body>

</html>
