<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Discover Movies</title>
    <link rel="icon" href="logo (2).png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W9P33H2NDM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-W9P33H2NDM');
    </script>

    <!-- Compiled CSS — no runtime Tailwind compiler, works on older browsers -->
    <link rel="stylesheet" href="tailwind.css">

    <!-- React 18 (UMD) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <!-- HLS.js for .m3u8 streaming (pinned ES5-compatible build for older TVs) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dangrek&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <base target="_blank">
</head>

<body class="bg-dark-900 text-white min-h-screen">
    <div id="root">
        <div class="sv-fallback">
            <div>
                <h1>Stream<span>Vault</span></h1>
                <p>Loading movies…</p>
                <p>If this message does not go away, this browser or device may not be supported.</p>
                <p><a href="login.html">Admin login</a></p>
            </div>
        </div>
    </div>

    <noscript>
        <div class="sv-fallback">
            <div>
                <h1>Stream<span>Vault</span></h1>
                <p>JavaScript is disabled. Please enable JavaScript to use StreamVault.</p>
            </div>
        </div>
    </noscript>

    <!-- ES5 polyfills for old smart TVs (must load first) -->
    <script src="polyfills.js"></script>
    <!-- Shared auth service — compiled for older browsers -->
    <script src="build/auth.js"></script>
    <!-- Main app — pre-compiled JSX (no Babel needed in the browser) -->
    <script src="build/app.js"></script>
</body>

</html>
